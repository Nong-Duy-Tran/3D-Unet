seed: 42

data:
  train_dir: data/train
  val_dir: data/val
  use_hdf5: false
  target_shape: [64, 64, 64]
  batch_size: 4
  num_workers: 32

model:
  name: simple  # simple | unet | resunet
  in_channels: 1
  num_classes: 2
  base_features: 32

training:
  max_epochs: 10
  lr: 1.0e-4
  weight_decay: 1.0e-5
  accelerator: gpu
  devices: [3]
  precision: 32
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 5
    min_delta: 0.0

logging:
  wandb:
    enabled: true
    project: alzheimer-baseline
    name: null
    tags: [baseline, 3d-unet]

checkpoint:
  dir: checkpoints/lightning
  monitor: val/loss
  mode: min
