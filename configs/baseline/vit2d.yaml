seed: 42

data:
  train_dir: data/train
  val_dir: data/val
  use_hdf5: false
  target_shape: [64, 64, 64]
  batch_size: 4
  num_workers: 32
  weighted_sampler: false
  use_2d: true
  num_slices: 8
  slice_axis: 0
  slice_strategy_train: random
  slice_strategy_val: uniform

model:
  name: vit2d  # simple | unet | resunet | vit2d
  in_channels: 1
  num_classes: 2
  base_features: 32  # simple only
  f_maps: 64         # unet/resunet only
  num_levels: 5      # unet/resunet only
  image_size: 64     # vit2d only
  patch_size: 8      # vit2d only
  embed_dim: 256     # vit2d only
  depth: 6           # vit2d only
  num_heads: 8       # vit2d only
  mlp_dim: 512       # vit2d only
  dropout: 0.1       # vit2d only

training:
  max_epochs: 256
  lr: 1.0e-4
  weight_decay: 1.0e-4
  accelerator: gpu
  devices: [3]
  precision: 32
  class_weights:
    enabled: true
    values: null
  lr_scheduler:
    enabled: true
    name: ReduceLROnPlateau
    monitor: val/auc_epoch
    mode: max
    factor: 0.5
    patience: 3
    threshold: 1.0e-3
    min_lr: 1.0e-6
  early_stopping:
    enabled: true
    monitor: val/auc_epoch
    mode: max
    patience: 12
    min_delta: 0.0

logging:
  wandb:
    enabled: true
    project: alzheimer-baseline
    name: null
    tags: [baseline, 3d-unet]

checkpoint:
  dir: checkpoints/lightning
  monitor: val/auc_epoch
  mode: max
