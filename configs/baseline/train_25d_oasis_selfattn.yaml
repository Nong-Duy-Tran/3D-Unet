seed: 42

data:
  format: jpg
  fold_index: 0
  task_name: ad_vs_nonad
  data_version: v3  # must match the suffix in data_root: processed_oasis_2d_cv5_v3
  data_root: "data/oasis_c2/processed_oasis_2d_cv5_${data.data_version}"
  train_dir: "${data.data_root}/axial/fold_${data.fold_index}/train"
  # If fold_${data.fold_index}/val does not exist, training creates an internal val split from train/.
  val_dir: "${data.data_root}/axial/fold_${data.fold_index}/val"
  test_dir: "${data.data_root}/axial/fold_${data.fold_index}/test"
  use_validation: true
  internal_val_ratio: 0.2
  internal_val_seed: 42
  classes: [nonad, ad]
  jpg_view: axial
  jpg_mode: 2p5d
  image_size: 224
  batch_size: 8
  num_workers: 4
  num_slices: 50
  window_size: 5
  slice_strategy_train: uniform
  slice_strategy_val: uniform
  normalize: true

model:
  name: timm25d
  timm_name: resnet18
  pretrained: false
  num_classes: 2
  in_channels: 5
  image_size: 224
  dropout: 0.1
  slice_embed_dim: null
  slice_pos_encoding: learned
  slice_pos_max_len: ${data.num_slices}
  slice_pos_dropout: 0.0
  slice_sequence_encoder: none
  slice_num_heads: 8
  slice_transformer_depth: 1
  slice_transformer_mlp_ratio: 4.0
  slice_transformer_dropout: 0.1
  slice_transformer_attn_dropout: 0.1
  attn_init: false
  slice_attn_hidden_dim: null
  slice_attn_dropout: 0.0
  slice_attn_activation: tanh
  slice_attn_use_layernorm: false
  slice_attn_mode: basic
  token_mlp_hidden_dim: null
  token_mlp_dropout: 0.0
  token_mlp_activation: gelu
  token_mlp_use_layernorm: false
  classifier_hidden_dim: null
  classifier_use_layernorm: false
  drop_path_rate: 0.0
  attn_drop_rate: 0.0

training:
  max_epochs: 128
  lr: 2.0e-5
  weight_decay: 0.05
  matmul_precision: high
  optimizer:
    name: AdamW
  loss:
    name: cross_entropy
    label_smoothing: 0.05
  accelerator: gpu
  devices: [0]
  precision: 32
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  freeze_backbone: false
  freeze_backbone_ratio: 1.0
  class_weights:
    enabled: false
  lr_scheduler:
    enabled: true
    name: CosineWarmup
    warmup_epochs: 5
    warmup_start_factor: 0.1
    eta_min: 1.0e-6
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 16
    min_delta: 0.0

logging:
  wandb:
    enabled: true
    project: alzheimer-baseline
    name: null
    group: ${model.timm_name}_pe_basicattn_${data.jpg_view}_${data.task_name}_${data.data_version}
    tags:
      - 25d
      - axial
      - oasis
      - jpg
      - resnet18
      - posenc
      - basic-attn
      - ${data.task_name}
      - ${data.data_version}

checkpoint:
  dir: checkpoints/25d/resnet18_pe_basicattn_50sl_5folds_${data.task_name}_${data.data_version}
  monitor: val/loss
  mode: min

output_dir: outputs/25d/resnet18_pe_basicattn_50sl_5folds_${data.task_name}_${data.data_version}
