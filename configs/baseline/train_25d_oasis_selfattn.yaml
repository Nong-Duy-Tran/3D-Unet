seed: 42

data:
  format: jpg
  fold_index: 0
  train_dir: "data/processed_oasis_2d_cv5/axial/fold_${data.fold_index}/train"
  val_dir: "data/processed_oasis_2d_cv5/axial/fold_${data.fold_index}/val"
  classes: [normal, alzheimer]
  jpg_view: axial
  jpg_mode: 2p5d
  image_size: 224
  batch_size: 8
  num_workers: 8
  num_slices: 64
  window_size: 5
  slice_strategy_train: uniform
  slice_strategy_val: uniform
  normalize: true

model:
  name: timm25d
  timm_name: resnet18
  pretrained: false
  num_classes: 2
  in_channels: 5
  image_size: 224
  dropout: 0.1
  slice_embed_dim: 512
  slice_pos_encoding: learned
  slice_pos_max_len: 64
  slice_pos_dropout: 0.0
  slice_sequence_encoder: self_attention
  slice_num_heads: 8
  slice_transformer_depth: 1
  slice_transformer_mlp_ratio: 4.0
  slice_transformer_dropout: 0.1
  slice_transformer_attn_dropout: 0.1
  slice_attn_hidden_dim: null
  slice_attn_dropout: 0.0
  slice_attn_activation: tanh
  slice_attn_use_layernorm: true
  drop_path_rate: 0.0
  attn_drop_rate: 0.0

training:
  max_epochs: 256
  lr: 3.0e-5
  weight_decay: 0.05
  optimizer:
    name: AdamW
  loss:
    name: cross_entropy
    label_smoothing: 0.05
  accelerator: gpu
  devices: [0]
  precision: 32
  accumulate_grad_batches: 1
  freeze_backbone: false
  freeze_backbone_ratio: 1.0
  class_weights:
    enabled: true
  lr_scheduler:
    enabled: true
    name: CosineWarmup
    warmup_epochs: 5
    warmup_start_factor: 0.1
    eta_min: 1.0e-6
  early_stopping:
    enabled: true
    monitor: val/auc_epoch
    mode: max
    patience: 32
    min_delta: 0.0

logging:
  wandb:
    enabled: true
    project: alzheimer-baseline
    name: null
    tags: [25d, axial, oasis, jpg, resnet18, self-attn, posenc]

checkpoint:
  dir: checkpoints/25d/resnet18_selfattn_pos_64sl_5folds
  monitor: val/auc_epoch
  mode: max

output_dir: outputs/25d/resnet18_selfattn_pos_64sl_5folds
