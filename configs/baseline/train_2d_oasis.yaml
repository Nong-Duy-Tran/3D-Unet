seed: 42

data:
  format: jpg
  root_dir: data/OASIS/jpg_all
  # Single-folder layout: all data live under one root.
  train_dir: data/OASIS/jpg_all/all
  val_dir: data/OASIS/jpg_all/all
  classes: [normal, alzheimer]
  # Split ratios used when preprocessing (subject-level).
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  # K-fold split file (subject-level). Set fold_index per run.
  split_file: data/OASIS/jpg_all/split_info/folds.json
  fold_index: 0
  image_size: 224
  batch_size: 4
  num_workers: 8
  randaugment_ops: 2
  randaugment_mag: 9
  num_slices: 120
  strategy: uniform
  val_strategy: uniform

model:
  name: deit2d
  timm_name: deit_base_patch16_224.fb_in1k
  pretrained: true
  num_classes: 2
  in_channels: 1
  image_size: 224
  drop_path_rate: 0.1
  attn_drop_rate: 0.0
  # simpleunet2d only (kept for override runs)
  base_features: 64
  head_hidden: 256
  dropout: 0.3
  head_dropout: 0.2

training:
  max_epochs: 256
  lr: 1.0e-5
  weight_decay: 0.05
  loss:
    label_smoothing: 0.1
  accelerator: gpu
  devices: [2]
  precision: 16
  accumulate_grad_batches: 4
  freeze_backbone: true
  class_weights:
    enabled: true
  lr_scheduler:
    enabled: true
    name: CosineWarmup
    warmup_epochs: 10
    warmup_start_factor: 0.1
    eta_min: 1.0e-6
  early_stopping:
    enabled: false
    monitor: val/auc_epoch
    mode: max
    patience: 16
    min_delta: 0.0

logging:
  wandb:
    enabled: true
    project: alzheimer-baseline
    name: null
    tags: [deit_base_attn_120sl, jpg, oasis, stratified_5folds]

checkpoint:
  dir: checkpoints/deit_base_attn_120sl_oasis_5folds
  monitor: val/auc_epoch
  mode: max

output_dir: outputs/train_2d_jpg_oasis
