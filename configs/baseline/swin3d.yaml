seed: 42

data:
  train_dir: data/train
  val_dir: data/val
  use_hdf5: false
  target_shape: [64, 64, 64]
  batch_size: 2
  num_workers: 16
  weighted_sampler: false

model:
  name: swin3d  # simple | unet | resunet | vit2d | swin2d | swin3d
  in_channels: 1
  num_classes: 2
  patch_size: 8
  embed_dim: 96
  depth: 4
  num_heads: 4
  window_size: 4
  mlp_dim: 256
  dropout: 0.1

training:
  max_epochs: 256
  lr: 5.0e-5
  weight_decay: 1.0e-4
  accelerator: gpu
  devices: [3]
  precision: 32
  class_weights:
    enabled: true
    values: null
  lr_scheduler:
    enabled: true
    name: ReduceLROnPlateau
    monitor: val/auc_epoch
    mode: max
    factor: 0.5
    patience: 3
    threshold: 1.0e-3
    min_lr: 1.0e-6
  early_stopping:
    enabled: true
    monitor: val/auc_epoch
    mode: max
    patience: 16
    min_delta: 0.0

logging:
  wandb:
    enabled: true
    project: alzheimer-baseline
    name: null
    tags: [baseline, 3d-unet]

checkpoint:
  dir: checkpoints/lightning
  monitor: val/auc_epoch
  mode: max
